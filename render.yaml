services:
  - type: web
    name: priyanshu-portfolio
    env: static
    buildCommand: npm install && pip install -r requirements.txt && python build.py && python build-prod.py
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /Smart_Fog_Vision/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Alternative: if you commit dist/ to GitHub, use simpler:
# buildCommand: ""
# staticPublishPath: ./dist
